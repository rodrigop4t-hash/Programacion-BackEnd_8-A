<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TacosMx</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Tacoschidos 🌮</h1>

    <form id="Form" class="buttons">
        <button type="button" data-type="Puerco">🐷 Puerco</button>
        <button type="button" data-type="Cerdo">🌮 Cerdo</button>
        <button type="button" data-type="Pollo">🐔 Pollo</button>
        <button type="button" data-type="Pescado">🐟 Pescado</button>
    </form>

    <div id="Container"></div>

    <script>
        document.querySelectorAll("#Form button").forEach(button => {
            button.addEventListener("click", async (event) => {
                const type = event.target.getAttribute("data-type").toLowerCase();

                try {
                    const response = await fetch(`/receta/${type}`);
                    const receta = await response.json();

                    const contenedor = document.getElementById("Container");

                    if (receta.error) {
                    } else {
                        contenedor.innerHTML = `
                            <h2>${receta.nombre}</h2> 
                            <p><strong>Precio:</strong> $${receta.precio}</p>

                            <h3>Proteína:</h3>
                            <p>${receta.ingredientes.proteina.nombre} (${receta.ingredientes.proteina.preparacion})</p>

                            <h3>Salsa:</h3>
                            <p>${receta.ingredientes.salsa.nombre} - Picor: ${receta.ingredientes.salsa.picor}</p>

                            <h3>Acompañamientos:</h3>
                            <ul>
                                ${receta.ingredientes.acompañamientos.map(a => 
                                    `<li>${a.nombre} (${a.cantidad})</li>`
                                ).join("")}
                            </ul>
                        `;
                    }
                } catch (error) {
                    console.error(error);
                    document.getElementById("Container").innerHTML = "<h2>Error al obtener datos</h2>";
                }
            });
        });
    </script>

</body>
</html>
